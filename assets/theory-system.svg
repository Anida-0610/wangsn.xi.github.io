<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">主要内容与世界观方法论相贯通</title><desc id="desc">主要内容的三组概括相互联系，六个必须坚持贯穿其中。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#547f8e" stroke-width="1.5"/></marker></defs><rect width="1600" height="900" fill="#fbf6ea"/><ellipse cx="270" cy="260" rx="300" ry="205" fill="#e0ece8" opacity=".45"/><ellipse cx="1350" cy="655" rx="320" ry="210" fill="#f5dfbb" opacity=".35"/><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif" fill="#254b5d"><text x="90" y="99" font-size="21" letter-spacing="5" fill="#a6633e">导论 · 概念与方法</text><text x="90" y="166" font-size="42" font-weight="600">主要内容与世界观方法论相贯通</text><path d="M90 198H1510" stroke="#ccd4ca"/><rect x="110" y="252" width="420" height="190" rx="16" fill="#e4eeea" stroke="#89a8ad" stroke-width="2"/><text x="320.0" y="309" text-anchor="middle" font-size="32" font-weight="600">十个明确</text><text x="320.0" y="361" text-anchor="middle" font-size="25" fill="#456773">主要观点与基本精神</text><text x="320.0" y="398" text-anchor="middle" font-size="25" fill="#456773">发挥统摄作用</text><rect x="590" y="252" width="420" height="190" rx="16" fill="#e4eeea" stroke="#89a8ad" stroke-width="2"/><text x="800.0" y="309" text-anchor="middle" font-size="32" font-weight="600">十四个坚持</text><text x="800.0" y="361" text-anchor="middle" font-size="25" fill="#456773">坚持和发展中国特色社会主义</text><text x="800.0" y="398" text-anchor="middle" font-size="25" fill="#456773">的基本方略</text><rect x="1070" y="252" width="420" height="190" rx="16" fill="#e4eeea" stroke="#89a8ad" stroke-width="2"/><text x="1280.0" y="309" text-anchor="middle" font-size="32" font-weight="600">十三个方面成就</text><text x="1280.0" y="361" text-anchor="middle" font-size="25" fill="#456773">系统展示</text><text x="1280.0" y="398" text-anchor="middle" font-size="25" fill="#456773">理论与实践成果</text><text x="800" y="498" text-anchor="middle" font-size="27">主要内容相互贯通，联系理论判断、实践要求与实践成果</text><path d="M800 526L800 590" stroke="#547f8e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="185" y="604" width="1230" height="156" rx="16" fill="#f6e5ce" stroke="#c39a73" stroke-width="2"/><text x="800.0" y="661" text-anchor="middle" font-size="32" font-weight="600">六个必须坚持</text><text x="800.0" y="713" text-anchor="middle" font-size="25" fill="#456773">人民至上 · 自信自立 · 守正创新 · 问题导向 · 系统观念 · 胸怀天下</text><text x="90" y="843" font-size="22" fill="#627881">教学示意图 · 六个必须坚持贯穿主要内容，不是另列的同层清单</text></g></svg>